[project]
name = "llm-latency-bench"
version = "0.1.0"
description = "Streaming latency benchmark (time to first token, tokens per second) for LLMs on OpenRouter"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jakub Synowiec" }]
requires-python = ">=3.14"
keywords = ["llm", "latency", "benchmark", "ttft", "openrouter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx2==2.13.1",
    "logfire==5.1.1",
    "openai==3.22.1",
    "opentelemetry-sdk==1.44.0",
    "pydantic-ai-slim[openai]==2.52.0",
    "python-dotenv==1.2.3",
]

[project.scripts]
llm-latency-bench = "llm_latency_bench.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "ty==0.0.84",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.logfire]
# Unit tests exercise the runner without configuring Logfire; real runs always configure it.
ignore_no_config = true
